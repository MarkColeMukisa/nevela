# Plain Laravel, plain Laravel behind Sanctum, and Nevela, against one Postgres.
#
#   - every app gets the same CPUs and memory (APP_CPUS, default 1), and Postgres more (PG_CPUS, default 2)
#   - only one app runs at a time: run.sh stops the others, because an idle container still takes a share
#   - k6 runs on this network, not through a published port, which on Docker Desktop
#     goes through a proxy that gives out before the apps do
#
# run.sh does everything; this file is what it starts.

name: nevela-bench

x-app: &app
  deploy:
    resources:
      limits:
        cpus: "${APP_CPUS:-1}"
        memory: 2G
  depends_on:
    postgres:
      condition: service_healthy

x-env: &env
  APP_ENV: production
  APP_DEBUG: "false"
  # A fixed key so the image needs no .env. It signs nothing that matters here.
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  LOG_CHANNEL: stderr
  LOG_LEVEL: error
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: bench
  # Plaintext to a container on the same network. "prefer" would try TLS on every connection first.
  DB_SSLMODE: disable
  DB_PERSISTENT: "true"
  CACHE_STORE: file
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  # PHP-FPM workers: 8 per CPU, as Grit's harness gives Laravel (32 for 4).
  FPM_WORKERS: "${FPM_WORKERS:-8}"

services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: bench
      POSTGRES_DB: bench
      # A database for this network only, never published: it asks for no password.
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      # Durability off: this measures the apps, not the disk. With fsync on, every write
      # waits for the disk, and the differences between the apps shrink into that wait.
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    deploy:
      resources:
        limits:
          cpus: "${PG_CPUS:-2}"
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 3s
      retries: 30

  laravel:
    <<: *app
    image: nevela-bench/laravel
    build:
      context: ..
      dockerfile: benchmarks/Dockerfile
      args:
        APP: laravel
    environment:
      <<: *env
      DB_DATABASE: bench_laravel

  # The same image, with its routes behind auth:sanctum, and the same database.
  laravel-auth:
    <<: *app
    image: nevela-bench/laravel
    pull_policy: never
    environment:
      <<: *env
      DB_DATABASE: bench_laravel
      BENCH_AUTH: "1"

  nevela:
    <<: *app
    image: nevela-bench/nevela
    build:
      context: ..
      dockerfile: benchmarks/Dockerfile
      args:
        APP: nevela
    environment:
      <<: *env
      DB_DATABASE: bench_nevela
      # Nevela's limits on the signed-in API (600 a minute per person, 1,200 per address) are
      # off for the race: k6 is one person at one address, asking hundreds of times a second.
      # Every other protection is as shipped.
      NEVELA_API_PER_PERSON: "0"
      NEVELA_API_PER_ADDRESS: "0"

  # ── The same two signed-in apps on Octane (FrankenPHP), which keeps the app booted ──
  laravel-auth-octane:
    <<: *app
    image: nevela-bench/laravel-octane
    build:
      context: ..
      dockerfile: benchmarks/Dockerfile.octane
      args:
        APP: laravel
    environment:
      <<: *env
      DB_DATABASE: bench_laravel
      BENCH_AUTH: "1"
      OCTANE_SERVER: frankenphp
      OCTANE_WORKERS: "${FPM_WORKERS:-8}"

  nevela-octane:
    <<: *app
    image: nevela-bench/nevela-octane
    build:
      context: ..
      dockerfile: benchmarks/Dockerfile.octane
      args:
        APP: nevela
    environment:
      <<: *env
      DB_DATABASE: bench_nevela
      # Nevela's limits on the signed-in API (600 a minute per person, 1,200 per address) are
      # off for the race: k6 is one person at one address, asking hundreds of times a second.
      # Every other protection is as shipped.
      NEVELA_API_PER_PERSON: "0"
      NEVELA_API_PER_ADDRESS: "0"
      OCTANE_SERVER: frankenphp
      OCTANE_WORKERS: "${FPM_WORKERS:-8}"

  # ── The rally's other contenders ──────────────────────────────────────
  # Grit: a plain `grit new --api` with `grit generate resource Product` (apps/grit.sh), as
  # Grit's own harness builds it, in its own image. Run as Grit's harness runs it: Sentinel,
  # Pulse and Studio off, no Redis. Its request limits are 0 in its rules table (apps/grit.sh).
  grit:
    <<: *app
    image: nevela-bench/grit
    build:
      context: ./apps/grit-bench/apps/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      GIN_MODE: release
      PORT: "8080"
      DB_PROVIDER: postgres
      DATABASE_URL: postgres://bench@postgres:5432/bench_grit?sslmode=disable
      # A fixed secret so the image needs no .env, as the PHP apps' APP_KEY. It signs nothing that matters here.
      JWT_SECRET: bench-only-not-a-secret-0123456789abcdef0123456789
      # Long enough for the whole run, so one sign-in serves every scenario.
      JWT_ACCESS_EXPIRY: 24h
      AUDIT_CHAIN_KEY: bench-only-not-a-secret-0123456789abcdef
      LOG_LEVEL: error
      DB_LOG_LEVEL: warn
      STORAGE_DRIVER: local
      ALLOW_LOCAL_STORAGE_IN_PRODUCTION: "true"
      STUDIO_ENABLED: "false"
      PULSE_ENABLED: "false"
      SENTINEL_ENABLED: "false"
      REDIS_URL: ""
      # Grit refuses to start in production with these at their defaults, even switched off.
      SENTINEL_PASSWORD: bench-only-not-a-secret-sentinel-0123456789
      SENTINEL_SECRET_KEY: bench-only-not-a-secret-sentinel-key-0123456789abcdef
      PULSE_PASSWORD: bench-only-not-a-secret-pulse-0123456789

  # Bun: Grit's harness's Bun.serve + Drizzle app, with a JWT check on every products route
  # (apps/bun). On Grit's own table: run.sh migrates its database with Grit's migrations.
  bun:
    <<: *app
    image: nevela-bench/bun
    build:
      context: ./apps/bun
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://bench@postgres:5432/bench_bun
      DB_MAX_OPEN_CONNS: "100"
      BENCH_JWT_SECRET: bench-only-not-a-secret-0123456789abcdef0123456789
      # One process per CPU the app is given, sharing the socket, as Bun's docs advise.
      BUN_WORKERS: "${APP_CPUS:-1}"
