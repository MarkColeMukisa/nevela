; A fixed pool, sized for the container's CPUs (FPM_WORKERS, set in docker-compose.yml).
; Too few, and requests queue for a worker, which would read as the framework being slow.
[www]
listen = 127.0.0.1:9000
pm = static
pm.max_children = ${FPM_WORKERS}
pm.max_requests = 0
clear_env = no
catch_workers_output = yes
access.log = /dev/null
