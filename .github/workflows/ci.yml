name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Laravel package (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    defaults:
      run:
        working-directory: packages/laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # gd and exif: the image optimiser's tests are skipped without them.
          extensions: gd, exif, fileinfo
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit

  api:
    name: Laravel app (generate, migrate, seed)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, gd, exif, fileinfo
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
      - run: php artisan migrate --force
      - name: Generated code is up to date
        run: |
          php artisan nevela:generate
          # --porcelain also lists files the generator created that were never committed.
          changed="$(git status --porcelain -- . ../web ../../nevela)"
          if [ -n "$changed" ]; then
            echo "Generated files are out of date. Run php artisan nevela:generate and commit:"
            echo "$changed"
            git diff -- . ../web ../../nevela
            exit 1
          fi
      # A product belongs to a category, so the categories come first.
      - run: php artisan nevela:seed Category --count=8
      - run: php artisan nevela:seed Product --count=1000
      - name: Seeded images were optimised and their renditions made
        run: |
          ls storage/app/public/products/image/*/*/ | grep -q '\.thumb\.'
          ls storage/app/public/products/image/*/*/ | grep -q '\.card\.'
          ls storage/app/private/nevela/originals/products/image/*/*/ | grep -q '\.png$'
      - run: php artisan test

  # The tests above run on SQLite. Postgres is stricter in ways that matter: one failed
  # statement aborts the transaction it is in, grouping and casts are checked, and text
  # compares by case. An app in production is more often on this than on SQLite.
  api-postgres:
    name: Laravel app (tests on Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway database on the runner, reachable only from this job: it asks for no password.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: nevela_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      # Set here, these win over the SQLite the test configuration names.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: nevela_test
      DB_USERNAME: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, gd, exif, fileinfo
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - run: php artisan migrate --force
      - run: php artisan test

  web:
    name: Web app (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter nevela-web
      - name: Release script tests
        run: pnpm test:release
      - name: create-nevela unit tests
        run: pnpm test:create
      - name: Docs changelog tests
        run: pnpm test:docs
      - name: Dashboard unit tests
        run: pnpm test:web
      - run: pnpm --filter nevela-web typecheck
      - run: pnpm --filter nevela-web build

  docs:
    name: Docs site (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter nevela-docs
      - run: pnpm docs:build

  create:
    name: create-nevela (new app, end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, gd, exif, fileinfo
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Run it the way people get it: from the packed npm tarball, not from the repository.
      - name: Pack create-nevela
        working-directory: packages/create-nevela
        run: |
          npm pack
          mkdir "$RUNNER_TEMP/create-nevela"
          tar -xzf create-nevela-*.tgz -C "$RUNNER_TEMP/create-nevela"
          test -f "$RUNNER_TEMP/create-nevela/package/template/web/_gitignore"
          test -f "$RUNNER_TEMP/create-nevela/package/packagist.mjs"
          for file in selfupdate shell project tool; do test -f "$RUNNER_TEMP/create-nevela/package/$file.mjs"; done
          test -f "$RUNNER_TEMP/create-nevela/package/LICENSE"
      - name: Create an app
        working-directory: ${{ runner.temp }}
        # --bundled-package: test the package as it is in this commit, not the last release on Packagist.
        # --no-blog: an app with nothing in it first, so the steps below can see that an empty one builds.
        # The blog is added further down with the command a new app runs for itself.
        run: node create-nevela/package/index.mjs demo-app --yes --pm pnpm --bundled-package --no-blog
      - name: The new app has what it should, and none of the examples
        working-directory: ${{ runner.temp }}/demo-app
        run: |
          test -f apps/web/.gitignore
          test -f apps/web/.env.local
          test -f apps/api/routes/nevela.php
          grep -q "export const resources = \[\] as const;" apps/web/resources/index.ts
          grep -q "HasApiTokens, HasFactory" apps/api/app/Models/User.php
          test ! -e apps/web/app/dashboard/products
          test ! -e apps/web/resources/product.resource.ts
          # Asked for no blog: no Post resource, no pages, and nothing for the site's header to link to.
          test ! -e apps/api/nevela/resources/post.json
          test ! -e apps/web/app/blog
          test ! -e apps/web/lib/blog.ts
          if grep -q '"blog"' apps/web/resources/index.ts; then echo "an app created with --no-blog has a blog"; exit 1; fi
          # The home page imports its newest posts from a file that shows nothing without a blog.
          grep -q 'return null;' apps/web/resources/latest-posts.tsx
          test ! -e apps/web/components/marketing/latest-posts.tsx
          test -d apps/web/node_modules
          grep -q '"nevela/laravel"' apps/api/composer.json
          grep -q '"laravel/sanctum"' apps/api/composer.json
          grep -q 'admin@example.com' README.md
      - name: Build the dashboard before any resource exists
        working-directory: ${{ runner.temp }}/demo-app/apps/web
        run: pnpm exec tsc --noEmit
      # From the top of the project, the way the docs say: no cd, and resource migrates.
      - name: Add a resource, a user and data with php nevela
        working-directory: ${{ runner.temp }}/demo-app
        run: |
          test -f nevela
          php nevela | grep -q "php nevela upgrade"
          php nevela version | grep -q "^Nevela [0-9]"
          # The blog, for an app created without one: what `nevela new` runs for itself otherwise.
          php nevela blog --sample | tee blog.log
          # A welcome, and a post for each tutorial the package ships, with its cover and a link to it.
          grep -q "sample posts: a welcome, and one for each of Nevela's" blog.log
          # The newest three on the home page: its import now leads to the app's own component, written once.
          test -f apps/web/components/marketing/latest-posts.tsx
          grep -q 'export { LatestPosts } from "@/components/marketing/latest-posts";' apps/web/resources/latest-posts.tsx
          test -f apps/api/nevela/resources/post.json
          for file in lib/blog.ts app/blog/page.tsx 'app/blog/[slug]/page.tsx' app/blog/feed.xml/route.ts app/sitemap.ts; do test -f "apps/web/$file"; done
          grep -q '"blog": "/blog"' apps/web/resources/index.ts
          grep -q '"publish": "publishedAt"' apps/web/resources/index.ts
          # Under a heading of its own in the sidebar, apart from the resources made with `nevela resource`.
          grep -q '"group": "Blog"' apps/api/nevela/resources/post.json
          grep -q 'group: "Blog"' apps/web/resources/post.resource.ts
          # Its model lets through the posts whose time has come, not none.
          grep -q "whereNotNull('published_at')" apps/api/app/Models/Post.php
          # Run again, it writes nothing over what is there.
          php nevela blog | tee blog-again.log
          grep -q 'exists (yours)' blog-again.log
          if grep -q 'created' blog-again.log; then echo "nevela blog wrote something the second time"; exit 1; fi
          # One command: the code, the table and the records.
          # Written the way Grit writes an image field, which Nevela also understands.
          php nevela resource Category --fields="name:string, slug:slug!, image:file:image?" --icon=tags --seed=6
          grep -q 'image: field.file(\["image"\], { required: false, list: true })' apps/web/resources/category.resource.ts
          # A relation and an optimised image, as in the shop guide.
          php nevela resource Product --fields="name:string, sku:string!, price:money, image:image(product)?, category:belongsTo(Category), kind:enum(stock|digital), notes:text?" --icon=package --seed=100
          grep -q 'products: field.hasMany("Product", { foreignKey: "categoryId" })' apps/web/resources/category.resource.ts
          grep -q 'categoryId: field.belongsTo("Category")' apps/web/resources/product.resource.ts
          grep -q "function products()" apps/api/app/Models/Category.php
          ls apps/api/storage/app/public/products/image/*/*/ | grep -q '\.thumb\.'
          # Rich text: an editor in the dashboard, which the build below compiles, and HTML in the table.
          php nevela resource Article --fields="title:string, body:richtext" --icon=newspaper --seed=3
          grep -q 'body: field.text({ list: true, ...({ column: "hidden" } as {}), ...({ rich: true } as {}) })' apps/web/resources/article.resource.ts
          grep -q "longText('body')" apps/api/database/migrations/*_create_articles_table.php
          # A private file field: its details name the record it is fetched through, not a public address.
          php nevela resource Candidate --fields="name:string, cv:file(pdf|private)?"
          grep -q "privateFile(\$this->cv, 'candidates', \$this->getKey(), 'cv')" apps/api/app/Http/Resources/Nevela/CandidateResource.php
          grep -q 'cv: field.file(\["pdf"\], { required: false, list: true, ...({ private: true } as {}), ...({ column: "hidden" } as {}) })' apps/web/resources/candidate.resource.ts
          # A public side: a sign-up form anyone can send, with a default for what the form leaves out.
          node -e '
            const fs = require("fs"), file = "apps/api/nevela/resources/signup.json";
            fs.writeFileSync(file, JSON.stringify({
              name: "Signup",
              fields: { email: { kind: "string", format: "email", unique: true }, source: { kind: "string", default: "website" } },
              public: { read: { fields: ["email"] }, create: { fields: ["email"], throttle: "3,1" } },
            }, null, 4) + "\n");
          '
          php nevela generate Signup
          php nevela migrate
          grep -q "Route::post('signups'" apps/api/routes/nevela-public.php
          grep -q "nevela.throttle:3,1,signups.create:" apps/api/routes/nevela-public.php
          grep -q "scopePublicQuery" apps/api/app/Models/Signup.php
          if grep -q "products\|categories" apps/api/routes/nevela-public.php; then echo "a resource with no public section got a public route"; exit 1; fi
          # A list people join: a form with a hidden field for bots, and an address that has to be proved.
          node -e '
            const fs = require("fs"), file = "apps/api/nevela/resources/member.json";
            fs.writeFileSync(file, JSON.stringify({
              name: "Member",
              fields: { email: { kind: "string", format: "email", unique: true } },
              public: { create: { fields: ["email"], protect: { honeypot: true }, confirm: "email" } },
            }, null, 4) + "\n");
          '
          php nevela generate Member
          php nevela migrate
          grep -q "Route::get('_nevela/form/members'" apps/api/routes/nevela-public.php
          grep -q "Route::post('_nevela/confirm/members/{id}/{key}'" apps/api/routes/nevela-public.php
          grep -q 'Concerns\\Confirmable' apps/api/app/Models/Member.php
          grep -q "confirmed_at" apps/api/database/migrations/*_create_members_table.php
          grep -q '"confirm": "email"' apps/web/resources/index.ts
          if grep -q "_nevela/form/signups\|_nevela/confirm/signups" apps/api/routes/nevela-public.php; then echo "a form with no protect got a token route"; exit 1; fi
          # An action: named in the descriptor, it gets a class to be written in, a permission and a button.
          node -e '
            const fs = require("fs"), file = "apps/api/nevela/resources/article.json";
            const descriptor = JSON.parse(fs.readFileSync(file, "utf8"));
            descriptor.actions = { publish: { label: "Publish", icon: "send", confirm: "Publish this article?" } };
            fs.writeFileSync(file, JSON.stringify(descriptor, null, 4) + "\n");
          '
          php nevela generate Article
          grep -q 'public function handle(Article $article, array $input): ?string' apps/api/app/Nevela/Actions/Article/Publish.php
          grep -q '"permission": "articles.publish"' apps/web/resources/index.ts
          # Lines: an order's items, described with it, edited in its form and saved with it.
          php nevela resource Order --fields="number:string!, customer:string, status:enum(pending|paid)" --items="OrderItem: product:belongsTo(Product), quantity:int, price:money" --seed=10
          grep -q '"items": "OrderItem"' apps/api/nevela/resources/order.json
          grep -q '"kind": "belongsTo"' apps/api/nevela/resources/order-item.json
          grep -q 'request->saveItems($order);' apps/api/app/Http/Controllers/Api/OrderController.php
          grep -q '"resource": "OrderItem"' apps/web/resources/index.ts
          # The table of the lines is made after the table of what they are lines of.
          test "$(ls apps/api/database/migrations | grep -n '_create_orders_table' | cut -d: -f1)" -lt "$(ls apps/api/database/migrations | grep -n '_create_order_items_table' | cut -d: -f1)"
          # A relation to a resource that doesn't exist is refused before anything is written.
          if php nevela resource Review --fields="body:text, author:belongsTo(Author)"; then echo "a relation to a missing resource was accepted"; exit 1; fi
          test ! -e apps/api/nevela/resources/review.json
          # A table the app made for itself, with numbered ids and a row in it, becomes a resource as it is.
          cat > apps/api/database/migrations/2026_01_01_000000_create_legacy_notes_table.php <<'PHP'
          <?php

          use Illuminate\Database\Migrations\Migration;
          use Illuminate\Database\Schema\Blueprint;
          use Illuminate\Support\Facades\DB;
          use Illuminate\Support\Facades\Schema;

          return new class extends Migration
          {
              public function up(): void
              {
                  Schema::create('legacy_notes', function (Blueprint $table) {
                      $table->id();
                      $table->foreignUuid('category_id')->nullable()->constrained()->nullOnDelete();
                      $table->string('title');
                      $table->timestamps();
                  });
                  DB::table('legacy_notes')->insert(['title' => 'From before', 'created_at' => now(), 'updated_at' => now()]);
              }
          };
          PHP
          php nevela migrate
          php nevela adopt legacy_notes --yes | tee adopt.log
          grep -q 'legacy_notes as LegacyNote, with integer ids' adopt.log
          grep -q 'categoryId:belongsTo(Category)?' adopt.log
          grep -q '"id": "int"' apps/api/nevela/resources/legacy-note.json
          grep -q '"adopted": true' apps/api/nevela/resources/legacy-note.json
          # No second migration to create it, and no UUIDs in its model.
          test "$(ls apps/api/database/migrations/*_create_legacy_notes_table.php | wc -l)" = 1
          if grep -q 'HasUuids' apps/api/app/Models/LegacyNote.php; then echo "an integer-id model was given UUIDs"; exit 1; fi
          grep -q "where(\['legacy_note' => '\[0-9\]{1,18}'\])" apps/api/routes/nevela.php
          # Adopting changes nothing in the database. Migrating afterwards gives the table its trash.
          ls apps/api/database/migrations/*_add_trash_to_legacy_notes_table.php
          php nevela migrate
          php nevela seed LegacyNote --count=5
          php nevela status | tee status.log
          grep -q "none pending" status.log
          grep -q "Resource: Product" status.log
          # The installer made the administrator, so an account made now is a plain USER unless told otherwise.
          php nevela user --name="CI" --email=ci@example.test --password=ci-password-123 --role=editor | tee user.log
          grep -q 'as EDITOR' user.log
          php nevela artisan test
      - name: Build the dashboard with the resource
        working-directory: ${{ runner.temp }}/demo-app/apps/web
        run: |
          pnpm exec tsc --noEmit
          pnpm run build
      - name: An update keeps the app's changes, backs up what it replaces, and can be undone
        working-directory: ${{ runner.temp }}/demo-app/apps/api
        env:
          # The tarball packed above stands in for npm at this commit's version.
          NEVELA_TEMPLATE_DIR: ${{ github.workspace }}/packages/create-nevela
        run: |
          version="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          # The installer recorded a fingerprint of every dashboard file.
          grep -q '"files"' ../web/.nevela.json
          php artisan nevela:status -v > fresh.log
          grep -q 'Your dashboard changes .* none' fresh.log

          # The app edits one file. Status sees exactly that.
          echo '// changed by the app' >> ../web/lib/csv.ts
          php artisan nevela:status -v | tee status.log
          grep -q 'changed lib/csv.ts' status.log

          # Pretend the app is on an older template in which lib/number.ts was different,
          # and that the app never touched it: the file and its recorded fingerprint agree.
          cp ../web/lib/number.ts number.current
          printf 'export const old = true;\n' > ../web/lib/number.ts
          # And that the older template had two files this one doesn't: one the app left
          # alone, which imports something that no longer exists, and one the app changed.
          printf 'import { gone } from "@/lib/nothing";\nexport const dropped = gone;\n' > ../web/lib/dropped.ts
          printf 'export const mine = 1;\n' > ../web/lib/dropped-but-mine.ts
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const file = "../web/.nevela.json";
            const record = JSON.parse(fs.readFileSync(file, "utf8"));
            const print = (path) => crypto.createHash("sha1").update(fs.readFileSync(path)).digest("hex");
            record.template = "0.1.0";
            record.files["lib/number.ts"] = print("../web/lib/number.ts");
            record.files["lib/dropped.ts"] = print("../web/lib/dropped.ts");
            record.files["lib/dropped-but-mine.ts"] = "0000000000000000000000000000000000000000";
            fs.writeFileSync(file, JSON.stringify(record, null, 4));
          '

          php artisan nevela:upgrade --check | tee check.log
          grep -q 'lib/number.ts .* would update' check.log
          grep -q 'lib/dropped.ts .* would remove' check.log
          grep -q 'export const old' ../web/lib/number.ts
          test -f ../web/lib/dropped.ts

          php artisan nevela:upgrade | tee update.log
          grep -q 'lib/number.ts .* updated' update.log
          cmp ../web/lib/number.ts number.current
          grep -q 'changed by the app' ../web/lib/csv.ts
          grep -q "\"template\": \"$version\"" ../web/.nevela.json
          grep -q '"history"' ../web/.nevela.json
          grep -rq 'export const old' ../web/.nevela/backups
          # A file the template dropped is removed when the app never changed it (it is in the
          # backup), and kept when the app did. Left behind, the first would break the build.
          test ! -e ../web/lib/dropped.ts
          grep -rq 'export const dropped' ../web/.nevela/backups
          test -f ../web/lib/dropped-but-mine.ts
          test "$(cat ../web/.nevela/.gitignore)" = "*"
          # The name it had before 0.3.0 still works.
          php artisan nevela:update > again.log
          grep -q 'latest template' again.log
          (cd ../.. && php nevela update | grep -q 'latest template')

          php artisan nevela:upgrade --undo | tee undo.log
          grep -q 'lib/number.ts .* restored' undo.log
          # Undo brings the removed file back.
          grep -q 'export const dropped' ../web/lib/dropped.ts
          grep -q 'export const old' ../web/lib/number.ts
          grep -q '"template": "0.1.0"' ../web/.nevela.json
          grep -q 'changed by the app' ../web/lib/csv.ts

          # And forward again, so the rest of the job runs on the current dashboard.
          php artisan nevela:update > /dev/null
          cmp ../web/lib/number.ts number.current
          test ! -e ../web/lib/dropped.ts
          rm ../web/lib/dropped-but-mine.ts
      - name: The same commands through the installer, as someone without php on their PATH would run them
        working-directory: ${{ runner.temp }}/demo-app/apps/web
        run: |
          version="$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          node "$RUNNER_TEMP/create-nevela/package/nevela.mjs" version | tee version.log
          grep -q "Nevela command  *v$version" version.log
          grep -q "This app  *v$version" version.log
          # Asked by a script, --version is the number and nothing else: `nevela update` reads it to check its work.
          test "$(node "$RUNNER_TEMP/create-nevela/package/nevela.mjs" --version)" = "$version"
          # version answers anywhere, not only in an app.
          (cd "$RUNNER_TEMP" && node create-nevela/package/nevela.mjs version | tee outside-version.log)
          grep -q "Nevela command  *v$version" "$RUNNER_TEMP/outside-version.log"
          if grep -q 'This app' "$RUNNER_TEMP/outside-version.log"; then exit 1; fi
          # nevela on its own says what it can do; it doesn't start creating an app.
          (cd "$RUNNER_TEMP" && node create-nevela/package/nevela.mjs | tee bare.log)
          grep -q 'nevela new \[name\]' "$RUNNER_TEMP/bare.log"
          # A new app with no name and nobody to ask: one clear line, exit 1, and no crash.
          status=0
          (cd "$RUNNER_TEMP" && node create-nevela/package/nevela.mjs new < /dev/null > no-name.log 2>&1) || status=$?
          cat "$RUNNER_TEMP/no-name.log"
          test "$status" = 1
          grep -q 'Give the app a name: nevela new my-app' "$RUNNER_TEMP/no-name.log"
          if grep -qi 'assertion' "$RUNNER_TEMP/no-name.log"; then exit 1; fi
          node "$RUNNER_TEMP/create-nevela/package/index.mjs" status > cli-status.log
          grep -q 'Migrations' cli-status.log
          # Outside an app it says so instead of creating an app called "status".
          (cd "$RUNNER_TEMP" && ! node create-nevela/package/index.mjs status 2> outside.log; grep -q "isn't in one" outside.log)
          # upgrade is the app's command. Checked, not run: nothing newer than this commit exists.
          NEVELA_NO_SELF_UPDATE=1 node "$RUNNER_TEMP/create-nevela/package/index.mjs" upgrade --check | tee cli-upgrade.log
          grep -q 'latest template' cli-upgrade.log
          # update is the nevela command updating itself. This copy was unpacked, not installed,
          # so outside an app it says how to install it and changes nothing,
          (cd "$RUNNER_TEMP" && node create-nevela/package/index.mjs update | tee tool-update.log)
          grep -q 'npm install -g create-nevela' "$RUNNER_TEMP/tool-update.log"
          # and inside one it does what "update" used to mean there: upgrade the app.
          NEVELA_NO_SELF_UPDATE=1 node "$RUNNER_TEMP/create-nevela/package/index.mjs" update --check | tee cli-update.log
          grep -q 'Upgrading this app' cli-update.log
          grep -q 'latest template' cli-update.log
      - name: Sign in and read the resource over HTTP
        working-directory: ${{ runner.temp }}/demo-app/apps/api
        run: |
          php artisan serve --port=8000 > /dev/null 2>&1 &
          for i in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:8000/api/auth/me && break; sleep 1; done
          # The starter account the installer made: the administrator.
          signin() { curl -s -X POST http://127.0.0.1:8000/api/auth/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d "{\"email\":\"$1\",\"password\":\"password\"}"; }
          bearer() { signin "$1" | sed -E 's/.*"token":"([^"]+)".*/\1/'; }
          signin admin@example.com | tee admin.json | grep -q '"token"'
          grep -q '"isAdmin":true' admin.json
          grep -q '"roles":\["ADMIN"\]' admin.json
          # Google and GitHub: listed in the new app's .env, and off until switched on.
          grep -q '^SOCIAL_AUTH_ENABLED=false' .env
          grep -q '^GOOGLE_CLIENT_ID=' .env
          curl -s http://127.0.0.1:8000/api/auth/config -H 'Accept: application/json' | grep -q '"social":\[\]'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/auth/oauth/google/start -H 'Accept: application/json')" = 404
          php artisan nevela:status | grep -q 'Social sign-in.*off'
          # And the ten sample users beside it: two editors, eight users, one of those switched off.
          admin="$(bearer admin@example.com)"
          curl -s "http://127.0.0.1:8000/api/_nevela/users?perPage=100" -H 'Accept: application/json' -H "Authorization: Bearer $admin" > users.json
          grep -q '"total":12' users.json
          test "$(grep -o '"name":"EDITOR"' users.json | wc -l)" = 3
          test "$(grep -o '"active":false' users.json | wc -l)" = 1
          # Each role gets what it should from the API: an editor the records and no say over users,
          editor="$(bearer amara.okafor@example.com)"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/products -H 'Accept: application/json' -H "Authorization: Bearer $editor")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/api/_nevela/roles -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer $editor" -d '{"name":"Mine","grants":["*"]}')" = 403
          # Several at once: all of them, or none and the row that was wrong.
          # (On categories: a later step counts the products exactly.)
          bulk() { curl -s -o bulk.json -w '%{http_code}' -X POST http://127.0.0.1:8000/api/categories/_bulk -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer $editor" -d "$1"; }
          categories() { curl -s -g "http://127.0.0.1:8000/api/categories?perPage=1" -H 'Accept: application/json' -H "Authorization: Bearer $editor" | sed -E 's/.*"total":([0-9]+).*/\1/'; }
          before="$(categories)"
          test "$(bulk '{"items":[{"name":"Bulk one","slug":"bulk-one"},{"name":"Bulk two","slug":"bulk-one"}]}')" = 422
          grep -q '"row":2' bulk.json
          test "$(categories)" = "$before"
          test "$(bulk '{"items":[{"name":"Bulk one","slug":"bulk-one"},{"name":"Bulk two","slug":"bulk-two"}]}')" = 201
          grep -q '"created":2' bulk.json
          test "$(categories)" = "$((before + 2))"
          # What the insights panel is drawn from: thirty days of counts, and the split by each choice.
          curl -s -g "http://127.0.0.1:8000/api/products/_insights" -H 'Accept: application/json' -H "Authorization: Bearer $editor" > insights.json
          test "$(grep -o '"bucket"' insights.json | wc -l)" = 30
          grep -q '"field":"kind"' insights.json
          grep -q '"total":100' insights.json
          test "$(curl -s -g -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/api/products/_insights?unit=year" -H 'Accept: application/json' -H "Authorization: Bearer $editor")" = 400
          # The blog as the site reads it, with no token: the posts it came with, a welcome and one per tutorial,
          came=$((1 + $(node -e "console.log(require(process.argv[1]).length)" "$GITHUB_WORKSPACE/packages/laravel/resources/tutorials/tutorials.json")))
          curl -s -g "http://127.0.0.1:8000/api/public/posts?sort=-publishedAt" -H 'Accept: application/json' | tee posts.json | grep -q "\"total\":$came"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/public/posts/welcome-to-your-blog -H 'Accept: application/json')" = 200
          # JSON writes a slash as backslash-slash, so the link is looked for by its host.
          curl -s http://127.0.0.1:8000/api/public/posts/billing-app -H 'Accept: application/json' | tee tutorial-post.json | grep -q '"slug":"billing-app"'
          grep -q 'nevela-docs.vercel.app' tutorial-post.json
          # and a post written now: a slug made from its title, and not on the site until it is published.
          curl -s -X POST http://127.0.0.1:8000/api/posts -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer $admin" -d '{"title":"Written in CI","body":"<p>Hello.</p>"}' | tee post.json | grep -q '"slug":"written-in-ci"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/public/posts/written-in-ci -H 'Accept: application/json')" = 404
          curl -s -g "http://127.0.0.1:8000/api/posts?filter[publishedAt]=draft" -H 'Accept: application/json' -H "Authorization: Bearer $admin" | grep -q '"total":1'
          written="$(sed -E 's/^\{"id":"([^"]+)".*/\1/' post.json)"
          curl -s -o /dev/null -X PATCH "http://127.0.0.1:8000/api/posts/$written" -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer $admin" -d '{"publishedAt":"2026-01-01T00:00:00Z","title":"Renamed in CI"}'
          # Published, it is there, at the address it was given first.
          curl -s http://127.0.0.1:8000/api/public/posts/written-in-ci -H 'Accept: application/json' | grep -q '"title":"Renamed in CI"'
          # Rich text is cleaned on the way in, whoever sends it.
          curl -s -X POST http://127.0.0.1:8000/api/articles -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer $admin" -d '{"title":"CI","body":"<p onclick=\"x()\">Hi<script>alert(1)</script></p>"}' | tee article.json | grep -q '"body":"<p>Hi<\\/p>"'
          # The public side, with no token at all. Nothing is public that no descriptor opens,
          open() { curl -s -o public.json -w '%{http_code}' -X "$1" "http://127.0.0.1:8000/api/public/$2" -H 'Accept: application/json' -H 'Content-Type: application/json' ${3:+-d "$3"}; }
          test "$(open GET products)" = 404
          test "$(open POST products '{"name":"x"}')" = 404
          # a form creates a record from the fields it lists and no others, the rest taking their defaults,
          test "$(open POST signups '{"email":"visitor@example.com","source":"mine"}')" = 422
          test "$(open POST signups '{"email":"visitor@example.com"}')" = 201
          grep -q '"email":"visitor@example.com"' public.json
          if grep -q 'source' public.json; then echo "a field that isn't public was sent out"; exit 1; fi
          # nothing can be read until the model says which records may be,
          test "$(open GET signups)" = 200
          grep -q '"total":0' public.json
          # and the form has its own allowance: three a minute here.
          test "$(open POST signups '{"email":"second@example.com"}')" = 201
          test "$(open POST signups '{"email":"third@example.com"}')" = 429
          grep -q 'Too many requests' public.json
          # A protected form hands out a token and the name of a field no person fills in.
          curl -s http://127.0.0.1:8000/api/public/_nevela/form/members -H 'Accept: application/json' | tee form.json | grep -q '"honeypot":"website"'
          token="$(sed -E 's/.*"token":"([^"]+)".*/\1/' form.json)"
          # A bot that fills it in is told it worked, and nothing is kept. So is one with no token.
          test "$(open POST members "{\"email\":\"bot@example.com\",\"website\":\"https://spam.test\",\"_form\":\"$token\"}")" = 201
          test "$(open POST members '{"email":"tokenless@example.com"}')" = 201
          # A person joins, unconfirmed: listed and marked, and not among the confirmed.
          test "$(open POST members "{\"email\":\"member@example.com\",\"_form\":\"$token\"}")" = 201
          curl -s -g "http://127.0.0.1:8000/api/members" -H 'Accept: application/json' -H "Authorization: Bearer $admin" | tee members.json | grep -q '"total":1'
          grep -q '"email":"member@example.com"' members.json
          grep -q '"confirmedAt":null' members.json
          curl -s -g "http://127.0.0.1:8000/api/members?filter[confirmed]=true" -H 'Accept: application/json' -H "Authorization: Bearer $admin" | grep -q '"total":0'
          # Joining twice is answered as the first time, and is still one record.
          test "$(open POST members "{\"email\":\"member@example.com\",\"_form\":\"$token\"}")" = 201
          # What was turned away is counted, for the dashboard to show.
          curl -s "http://127.0.0.1:8000/api/_nevela/forms/members" -H 'Accept: application/json' -H "Authorization: Bearer $admin" | tee blocked.json | grep -q '"total":2'
          grep -q '"reason":"honeypot","label":"filled the hidden field","count":1' blocked.json
          grep -q '"reason":"forged","label":"no form token","count":1' blocked.json
          # A private file: its key opens nothing, and the record's own address hands it to someone who may view the record.
          printf '%%PDF-1.4\n1 0 obj\n<< /Type /Catalog >>\nendobj\n%%%%EOF\n' > cv.pdf
          curl -s -X PUT "http://127.0.0.1:8000/api/_nevela/uploads/Candidate/cv?name=cv.pdf" -H 'Accept: application/json' -H 'Content-Type: application/pdf' -H "Authorization: Bearer $admin" --data-binary @cv.pdf > upload.json
          grep -q '"private":true' upload.json
          cv="$(sed -E 's/.*"key":"([^"]+)".*/\1/' upload.json | sed 's#\\/#/#g')"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/api/_nevela/files/$cv")" = 404
          candidate="$(curl -s -X POST http://127.0.0.1:8000/api/candidates -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer $admin" -d "{\"name\":\"CI\",\"cv\":\"$cv\"}" | sed -E 's/^\{"id":"([^"]+)".*/\1/')"
          curl -s -D headers.txt -o got.pdf "http://127.0.0.1:8000/api/_nevela/private/candidates/$candidate/cv" -H "Authorization: Bearer $admin"
          cmp cv.pdf got.pdf
          grep -qi 'cache-control:.*no-store' headers.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/api/_nevela/private/candidates/$candidate/cv" -H 'Accept: application/json' -H "Authorization: Bearer $(bearer sofia.martinez@example.com)")" = 403
          # An action is a permission of its own: an editor, who may edit articles, may not publish one.
          article="$(sed -E 's/.*"id":"([^"]+)".*/\1/' article.json)"
          publish() { curl -s -o publish.json -w '%{http_code}' -X POST "http://127.0.0.1:8000/api/articles/$article/_actions/publish" -H 'Accept: application/json' -H "Authorization: Bearer $1"; }
          test "$(publish "$editor")" = 403
          # Nobody has written what it does yet, and it says so, having changed nothing.
          test "$(publish "$admin")" = 500
          grep -q "didn't work, and nothing was changed" publish.json
          # The adopted table: the row that was there before Nevela, its number sent as a string.
          curl -s http://127.0.0.1:8000/api/legacy-notes/1 -H 'Accept: application/json' -H "Authorization: Bearer $admin" | tee legacy.json | grep -q '"id":"1"'
          grep -q '"title":"From before"' legacy.json
          curl -s -g "http://127.0.0.1:8000/api/legacy-notes?perPage=1" -H 'Accept: application/json' -H "Authorization: Bearer $admin" | grep -q '"total":6'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/legacy-notes/first -H 'Accept: application/json' -H "Authorization: Bearer $admin")" = 404
          # The trash: a deleted record is kept and hidden, comes back when restored, and goes when removed for good.
          call() { curl -s -g -o trash.json -w '%{http_code}' -X "$1" "http://127.0.0.1:8000/api/$2" -H 'Accept: application/json' -H "Authorization: Bearer $editor"; }
          bulked="$(sed -E 's/.*"id":"([^"]+)".*/\1/' bulk.json)"
          test "$(call DELETE "categories/$bulked")" = 204
          test "$(categories)" = "$((before + 1))"
          test "$(call GET "categories/$bulked")" = 404
          test "$(call GET _nevela/trash)" = 200
          grep -q '"days":30' trash.json
          grep -Eq '"slug":"categories","icon":("[a-z-]+"|null),"count":1' trash.json
          test "$(call GET _nevela/trash/categories)" = 200
          grep -q "\"id\":\"$bulked\"" trash.json
          test "$(call POST "_nevela/trash/categories/$bulked/restore")" = 200
          test "$(categories)" = "$((before + 2))"
          test "$(call DELETE "categories/$bulked")" = 204
          test "$(call DELETE _nevela/trash/categories)" = 422
          test "$(call DELETE '_nevela/trash/categories?confirm=categories')" = 200
          grep -q '"removed":1' trash.json
          test "$(call GET _nevela/trash/categories)" = 200
          grep -q '"total":0' trash.json
          test "$(categories)" = "$((before + 1))"
          (cd .. && cd .. && php nevela trash | grep -q 'Nothing in the trash is older than 30 days')
          # Deleted accounts: a deleted user is closed and kept, can't sign in, comes back when restored,
          # and once removed for good leaves its email blocked until it is allowed again.
          as_admin() { curl -s -g -o account.json -w '%{http_code}' -X "$1" "http://127.0.0.1:8000/api/$2" -H 'Accept: application/json' -H 'Content-Type: application/json' -H "Authorization: Bearer $admin" ${3:+-d "$3"}; }
          person='{"name":"Closing Soon","email":"closing.soon@gmail.com","password":"harbour-lantern-quartz-4821","roles":[]}'
          closing_signin() { curl -s -X POST http://127.0.0.1:8000/api/auth/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"email":"closing.soon@gmail.com","password":"harbour-lantern-quartz-4821"}'; }
          test "$(as_admin POST _nevela/users "$person")" = 201
          closing="$(sed -E 's/^\{"id":"([^"]+)".*/\1/' account.json)"
          test "$(as_admin DELETE "_nevela/users/$closing")" = 204
          test "$(as_admin GET "_nevela/users/$closing")" = 404
          closing_signin | grep -q 'ACCOUNT_CLOSED'
          test "$(as_admin GET _nevela/deleted-accounts)" = 200
          grep -q '"total":1' account.json
          grep -q '"closedBy":"admin"' account.json
          test "$(as_admin POST "_nevela/deleted-accounts/$closing/restore")" = 200
          closing_signin | grep -q '"token"'
          test "$(as_admin DELETE "_nevela/users/$closing")" = 204
          test "$(as_admin DELETE "_nevela/deleted-accounts/$closing")" = 204
          # Another spelling of the same mailbox is the same mailbox.
          test "$(as_admin POST _nevela/users '{"name":"Back Again","email":"Closing.Soon+back@gmail.com","password":"harbour-lantern-quartz-4821","roles":[]}')" = 422
          grep -q 'blocked' account.json
          test "$(as_admin GET _nevela/blocked-emails)" = 200
          # The hint is the first letter, three dots (escaped in the JSON) and the domain.
          grep -Eq '"hint":"c[^"@.]+@gmail\.com"' account.json
          if grep -q 'closing.soon' account.json; then echo "the address itself was kept"; exit 1; fi
          blocked="$(sed -E 's/.*"data":\[\{"id":"([^"]+)".*/\1/' account.json)"
          test "$(as_admin DELETE "_nevela/blocked-emails/$blocked")" = 204
          test "$(as_admin POST _nevela/users "$person")" = 201
          test "$(as_admin DELETE "_nevela/users/$(sed -E 's/^\{"id":"([^"]+)".*/\1/' account.json)")" = 204
          # a user nothing but their own account,
          plain="$(bearer sofia.martinez@example.com)"
          curl -s http://127.0.0.1:8000/api/_nevela/trash -H 'Accept: application/json' -H "Authorization: Bearer $plain" | grep -q '"resources":\[\]'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/auth/me -H 'Accept: application/json' -H "Authorization: Bearer $plain")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/products -H 'Accept: application/json' -H "Authorization: Bearer $plain")" = 403
          # and a switched-off account no way in.
          signin noah.williams@example.com | grep -q 'ACCOUNT_DISABLED'
          token="$(curl -s -X POST http://127.0.0.1:8000/api/auth/token -H 'Accept: application/json' -H 'Content-Type: application/json' -d '{"email":"ci@example.test","password":"ci-password-123"}' | sed -E 's/.*"token":"([^"]+)".*/\1/')"
          curl -s http://127.0.0.1:8000/api/_nevela/ping | grep -q '"nevela"'
          # With the API up, status finds it and says it is this app.
          (cd .. && cd .. && php nevela status | grep -q 'it is this app')
          curl -s -g "http://127.0.0.1:8000/api/products?perPage=1" -H 'Accept: application/json' -H "Authorization: Bearer $token" | tee /dev/stderr | grep -q '"total":100'

  tutorials:
    # Each tutorial in the docs, done for real: examples/<name>/steps.sh holds its commands
    # and the files it has you write, run in a new app made as people make one.
    name: Tutorials (each one, in a new app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, gd, exif, fileinfo
          coverage: none
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack create-nevela
        working-directory: packages/create-nevela
        run: |
          npm pack
          mkdir "$RUNNER_TEMP/create-nevela"
          tar -xzf create-nevela-*.tgz -C "$RUNNER_TEMP/create-nevela"
      - name: Do each tutorial
        working-directory: ${{ runner.temp }}
        run: |
          for steps in "$GITHUB_WORKSPACE"/examples/*/steps.sh; do
            name="$(basename "$(dirname "$steps")")"
            echo "::group::$name"
            # --bundled-package: the package as it is in this commit, not the last release.
            node create-nevela/package/index.mjs "$name" --yes --pm pnpm --bundled-package
            (cd "$name" && bash "$steps")
            (cd "$name/apps/web" && pnpm exec tsc --noEmit && pnpm run build)
            echo "::endgroup::"
          done
