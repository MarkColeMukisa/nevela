name: Benchmark

# Nevela against plain Laravel, on one GitHub runner, every app in turn. See
# benchmarks/README.md for what is measured and how to read it.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: Runs of each app in each scenario (the median is reported)
        default: "3"
      duration:
        description: Length of each run, in seconds (30s)
        default: 30s
  pull_request:
    paths:
      - benchmarks/**
      - .github/workflows/benchmark.yml

# It runs scripts from the pull request, so its token can read and nothing more.
permissions:
  contents: read

# One at a time: two benchmarks sharing a runner pool measure each other.
concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Nevela against plain Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: benchmarks
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes, so the token isn't left in .git/config for the scripts to find.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every app answers every scenario without a failure, before half an hour is spent measuring.
      - run: ./run.sh check
      - run: ./run.sh
        env:
          REPS: ${{ inputs.reps || '3' }}
          DURATION: ${{ inputs.duration || '30s' }}
      - run: node report.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/results/
