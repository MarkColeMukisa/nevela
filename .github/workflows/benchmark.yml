name: Benchmark

# The speed rally: Nevela against plain Laravel, Grit and Bun, on one GitHub runner, every
# app in turn. See benchmarks/README.md for what is measured and how to read it.
on:
  workflow_dispatch:
    inputs:
      reps:
        description: Runs of each app in each scenario (the median is reported)
        default: "3"
      duration:
        description: Length of each run, in seconds (30s)
        default: 30s
  pull_request:
    paths:
      - benchmarks/**
      - .github/workflows/benchmark.yml

# It runs scripts from the pull request, so its token can read and nothing more.
permissions:
  contents: read

# One at a time: two benchmarks sharing a runner pool measure each other.
concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Nevela, Laravel, Grit, Rust, Next.js and Bun
    runs-on: ubuntu-latest
    # Nine apps, four scenarios, three runs each, and the builds: about three and a half hours.
    timeout-minutes: 330
    defaults:
      run:
        working-directory: benchmarks
    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes, so the token isn't left in .git/config for the scripts to find.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Grit's side is built by Grit's own CLI, at the version the rally is pinned to.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - run: go install github.com/MUKE-coder/grit/v3/cmd/grit@v3.581.0
      - run: ./apps/grit.sh
      # Every app answers every scenario without a failure, before half an hour is spent measuring.
      - run: ./run.sh check
      - run: ./run.sh
        env:
          REPS: ${{ inputs.reps || '3' }}
          DURATION: ${{ inputs.duration || '30s' }}
      - run: node report.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/results/
